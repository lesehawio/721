<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>PROJECT 721 · منوی اصلی</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* ============================================================
           RESET & ROOT
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #070a12;
            --bg-card: rgba(10, 18, 32, 0.5);
            --border-glass: rgba(19, 244, 210, 0.06);
            --border-glass-hover: rgba(19, 244, 210, 0.12);
            --text: #d0ddf0;
            --text-muted: rgba(19, 244, 210, 0.2);
            --accent: #13f4d2;
            --accent-dim: rgba(19, 244, 210, 0.04);
            --shadow: 0 16px 48px rgba(0, 0, 0, 0.3);
            --shadow-hover: 0 20px 64px rgba(0, 0, 0, 0.4);
            --radius: 20px;
            --radius-sm: 12px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Vazirmatn', sans-serif;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            overflow: hidden;
            position: relative;
        }

        /* ============================================================
           BACKGROUND — Animated
           ============================================================ */
        .bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(ellipse at 30% 20%, rgba(19, 244, 210, 0.02) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(19, 244, 210, 0.01) 0%, transparent 50%),
                var(--bg);
        }

        /* Particles */
        .particle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(19, 244, 210, 0.04), transparent);
            animation: floatParticle linear infinite;
            pointer-events: none;
        }
        @keyframes floatParticle {
            0% {
                transform: translateY(100vh) scale(0.2);
                opacity: 0;
            }
            15% {
                opacity: 0.3;
            }
            85% {
                opacity: 0.3;
            }
            100% {
                transform: translateY(-10vh) scale(0.6);
                opacity: 0;
            }
        }

        /* Glow ring */
        .glow-ring {
            position: absolute;
            border: 1px solid rgba(19, 244, 210, 0.02);
            border-radius: 50%;
            animation: ringPulse 8s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes ringPulse {
            0%,
            100% {
                transform: scale(0.8);
                opacity: 0.05;
            }
            50% {
                transform: scale(1.1);
                opacity: 0.1;
            }
        }

        /* ============================================================
           MENU CONTAINER
           ============================================================ */
        .menu {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 440px;
            animation: fadeInUp 0.6s ease;
        }
        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(24px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius);
            padding: 2.2rem 1.8rem 2rem;
            box-shadow: var(--shadow);
            transition: all var(--transition);
            position: relative;
            overflow: hidden;
            text-align: center;
        }
        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 20%, rgba(19, 244, 210, 0.01), transparent 60%);
            pointer-events: none;
        }
        .card:hover {
            border-color: var(--border-glass-hover);
            box-shadow: var(--shadow-hover);
        }

        /* ============================================================
           LOGO
           ============================================================ */
        .logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            z-index: 1;
        }
        .logo .logo-img {
            width: 140px;
            height: 140px;
            object-fit: contain;
            display: block;
            margin: 0 auto;
            filter: drop-shadow(0 4px 30px rgba(19, 244, 210, 0.08));
            transition: transform 0.3s ease;
        }
        .logo .logo-img:hover {
            transform: scale(1.02);
        }
        .logo .brand {
            font-size: 1.5rem;
            font-weight: 700;
            margin-top: 12px;
            background: linear-gradient(135deg, #13f4d2, #0bc5a8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }
        .logo .sub {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 2px;
            font-weight: 300;
        }

        /* ============================================================
           DIVIDER
           ============================================================ */
        .divider {
            width: 50px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(19, 244, 210, 0.06), transparent);
            margin: 1.2rem auto 1.6rem;
            position: relative;
            overflow: hidden;
        }
        .divider::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 60%;
            height: 100%;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            animation: dividerMove 3s ease-in-out infinite;
        }
        @keyframes dividerMove {
            0%,
            100% {
                transform: translateX(0);
                opacity: 0.2;
            }
            50% {
                transform: translateX(20px);
                opacity: 0.6;
            }
        }

        /* ============================================================
           ITEMS
           ============================================================ */
        .items {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .item {
            display: flex;
            align-items: center;
            padding: 0.7rem 0.9rem;
            background: rgba(20, 30, 50, 0.15);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-sm);
            text-decoration: none;
            color: var(--text);
            transition: all var(--transition);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .item::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 3px;
            height: 100%;
            background: var(--accent);
            opacity: 0;
            transition: opacity var(--transition);
            border-radius: 0 2px 2px 0;
        }
        .item::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at center, rgba(19, 244, 210, 0.01), transparent 60%);
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }
        .item:hover {
            background: rgba(20, 30, 50, 0.25);
            border-color: var(--border-glass-hover);
            transform: translateX(-4px);
            box-shadow: var(--shadow-hover);
        }
        .item:hover::before {
            opacity: 1;
        }
        .item:hover::after {
            opacity: 1;
        }

        .item .icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            flex-shrink: 0;
            transition: var(--transition);
        }
        .item .icon.purple {
            background: rgba(19, 244, 210, 0.04);
            color: var(--accent);
        }
        .item .icon.blue {
            background: rgba(19, 244, 210, 0.04);
            color: #38bdf8;
        }
        .item:hover .icon.purple {
            background: rgba(19, 244, 210, 0.08);
        }
        .item:hover .icon.blue {
            background: rgba(56, 189, 248, 0.06);
        }

        .item .info {
            flex: 1;
            margin-right: 0.7rem;
            text-align: right;
        }
        .item .info .title {
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: -0.2px;
        }
        .item .info .desc {
            font-size: 0.55rem;
            color: var(--text-muted);
            opacity: 0.5;
            margin-top: 0.05rem;
            letter-spacing: 0.3px;
        }

        .item .arrow {
            color: var(--text-muted);
            font-size: 0.7rem;
            transition: var(--transition);
            opacity: 0.15;
        }
        .item:hover .arrow {
            opacity: 0.7;
            transform: translateX(-4px);
            color: var(--accent);
        }

        /* ============================================================
           FOOTER
           ============================================================ */
        .footer {
            font-size: 0.4rem;
            color: var(--text-muted);
            opacity: 0.15;
            text-align: center;
            margin-top: 1.2rem;
            letter-spacing: 0.5px;
            position: relative;
            z-index: 1;
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 640px) {
            body {
                padding: 1rem 0.6rem;
            }
            .card {
                padding: 1.6rem 1.2rem 1.4rem;
                border-radius: var(--radius-sm);
            }
            .logo .logo-img {
                width: 110px;
                height: 110px;
            }
            .logo .brand {
                font-size: 1.2rem;
            }
            .logo .sub {
                font-size: 0.55rem;
            }
            .item {
                padding: 0.5rem 0.7rem;
            }
            .item .icon {
                width: 32px;
                height: 32px;
                font-size: 0.75rem;
            }
            .item .info .title {
                font-size: 0.75rem;
            }
            .item .info .desc {
                font-size: 0.5rem;
            }
            .divider {
                width: 40px;
                margin: 0.8rem auto 1.2rem;
            }
        }
        @media (max-width: 400px) {
            .card {
                padding: 1.2rem 0.8rem 1rem;
                border-radius: var(--radius-sm);
            }
            .logo .logo-img {
                width: 90px;
                height: 90px;
            }
            .logo .brand {
                font-size: 1rem;
            }
            .logo .sub {
                font-size: 0.5rem;
                letter-spacing: 1px;
            }
            .item {
                padding: 0.4rem 0.5rem;
            }
            .item .icon {
                width: 28px;
                height: 28px;
                font-size: 0.65rem;
            }
            .item .info .title {
                font-size: 0.65rem;
            }
            .item .info .desc {
                display: none;
            }
            .divider {
                width: 30px;
                margin: 0.6rem auto 0.8rem;
            }
        }
    </style>
</head>
<body>

    <!-- ============================================================
    BACKGROUND — Animated
    ============================================================ -->
    <div class="bg">
        <div class="glow-ring" style="top:15%;right:20%;width:140px;height:140px;"></div>
        <div class="glow-ring" style="bottom:20%;left:15%;width:180px;height:180px;animation-delay:3s;"></div>
        <div id="particles"></div>
    </div>

    <!-- ============================================================
    MENU
    ============================================================ -->
    <div class="menu">

        <div class="card">

            <!-- ===== LOGO ===== -->
            <div class="logo">
                <img class="logo-img" src="https://uploadkon.ir/uploads/bc8d07_26ChatGPT-Image-Jul-7-2026-07-35-41-PM.png" alt="PROJECT 721" />
                <div class="brand">PROJECT 721</div>
                <div class="sub">Behavioral Engineering</div>
            </div>

            <div class="divider"></div>

            <!-- ===== ITEMS ===== -->
            <div class="items">

                <a href="protocol.html" class="item">
                    <div class="info">
                        <div class="title">📋 پروتکل‌ها</div>
                        <div class="desc">موتور جستجوی مداخلات رفتاری</div>
                    </div>
                    <div class="icon purple"><i class="fas fa-book"></i></div>
                    <span class="arrow"><i class="fas fa-chevron-left"></i></span>
                </a>

                <a href="project.html" class="item">
                    <div class="info">
                        <div class="title">🧠 پروژه ۱۲۱</div>
                        <div class="desc">سیستم تحلیل و مدیریت پرونده‌ها</div>
                    </div>
                    <div class="icon blue"><i class="fas fa-brain"></i></div>
                    <span class="arrow"><i class="fas fa-chevron-left"></i></span>
                </a>

            </div>

            <!-- ===== FOOTER ===== -->
            <div class="footer">v2.0 · Intelligent Intervention System</div>

        </div>

    </div>

    <script>
        // ============================================================
        // PARTICLES
        // ============================================================
        (function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 20; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const size = 2 + Math.random() * 3;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = (14 + Math.random() * 18) + 's';
                p.style.animationDelay = (Math.random() * 18) + 's';
                container.appendChild(p);
            }
        })();

        console.log('🧠 PROJECT 721 · منوی اصلی');
        console.log('📋 پروتکل‌ها → protocol.html');
        console.log('🧠 پروژه ۱۲۱ → project.html');
        console.log('✨ تم: فیروزه‌ای براق با حس علمی');
    </script>

</body>
</html>
